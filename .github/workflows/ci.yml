name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Test Swift application
        run: swift test
      - name: Build app bundle
        env:
          RELAY_APP_OUTPUT: ${{ runner.temp }}/Relay.app
          RELAY_SKIP_WORKSPACE_LINK: "1"
        run: ./scripts/build-app.sh release

  relayd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: remote/relayd/go.mod
          cache-dependency-path: remote/relayd/go.sum
      - name: Test relayd
        working-directory: remote/relayd
        run: go test -race ./...
      - name: Vet relayd
        working-directory: remote/relayd
        run: go vet ./...
