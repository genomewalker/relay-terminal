name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Test Swift application
        env:
          RELAY_TESTING: "1"
        run: swift test --disable-xctest -Xswiftc -DRELAY_DISABLE_FOUNDATION_MODELS

  macos-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: remote/relayd/go.mod
          cache-dependency-path: remote/relayd/go.sum
      - name: Build app bundle
        env:
          RELAY_APP_OUTPUT: ${{ runner.temp }}/Relay.app
          RELAY_SKIP_WORKSPACE_LINK: "1"
        run: ./scripts/build-app.sh release
      - name: Build and inspect installer image
        run: |
          ./scripts/create-dmg.sh "${{ runner.temp }}/Relay.app" "${{ runner.temp }}/Relay.dmg"
          mount_point="$(mktemp -d "${RUNNER_TEMP}/relay-mount.XXXXXX")"
          trap 'hdiutil detach "$mount_point" >/dev/null 2>&1 || true; rmdir "$mount_point" >/dev/null 2>&1 || true' EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_point" "${{ runner.temp }}/Relay.dmg" >/dev/null
          test -x "$mount_point/Relay.app/Contents/MacOS/Relay"
          test -L "$mount_point/Applications"
          /usr/bin/codesign --verify --deep --strict "$mount_point/Relay.app"

  relayd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: remote/relayd/go.mod
          cache-dependency-path: remote/relayd/go.sum
      - name: Test relayd
        working-directory: remote/relayd
        run: go test -race ./...
      - name: Vet relayd
        working-directory: remote/relayd
        run: go vet ./...
